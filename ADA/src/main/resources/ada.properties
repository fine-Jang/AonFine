# ADA 저장소/정책 설정. 비밀번호 등 민감정보는 포함하지 않는다(DB 접속은 JNDI로 처리).
#
# storage.root: Worker(192.168.2.17) /DATA를 NFS로 마운트한 WAS2(192.168.2.14)의 /DATA 아래
# ADA 전용 하위 디렉터리. 실제 운영 배포 전, 이 경로 아래 incoming/, store/ 디렉터리를
# jboss(uid/gid 1001) 권한으로 미리 생성해야 한다 (JBoss가 직접 mkdir할 필요 없도록).
ada.storage.root=/DATA/ada

# NFS가 실제로 마운트되어 있는지 확인하는 마커 파일. Worker의 /DATA export 안에 미리 만들어 두면
# (예: Worker에서 `touch /DATA/.ada_nfs_marker` 후 WAS2로 마운트되어 함께 보임) WAS2 로컬 /DATA가
# NFS 대신 로컬 디스크로 되돌아간 상황(마운트 해제)을 이 파일의 부재로 감지할 수 있다.
# 로컬 /DATA는 NFS 구성 시 root:root 700으로 잠가두었으므로 실제로는 jboss 프로세스의 쓰기 자체가
# 거부되지만, 이 마커 검사는 더 명확한 사용자 메시지를 위한 2차 방어선이다.
ada.storage.nfsMarkerFile=/DATA/.ada_nfs_marker

# 5GB 미만: 5,000,000,000 바이트 미만만 허용 (요구사항 문서화 값과 동일)
ada.upload.maxFileSizeBytes=4999999999

# 저장 중 여유공간이 이 값 아래로 내려가면 업로드를 중단한다 (기본 2GB 여유분)
ada.upload.minFreeSpaceReserveBytes=2147483648

# 스트리밍 저장 중 몇 바이트마다 여유공간을 재검사할지 (기본 64MB)
ada.upload.spaceCheckIntervalBytes=67108864

# tar 엔트리 개수 상한 (zip/tar bomb 방지)
ada.validate.maxTarEntries=200000

# 압축 해제(논리적) 총 용량 상한. 디스크에 실제로 쓰지는 않지만 무한 스트림 공격을 막기 위한 상한.
ada.validate.maxDecompressedTotalBytes=107374182400

# 압축 대비 해제 용량 비율 상한 (예: 300배 이상이면 폭탄 의심으로 중단)
ada.validate.maxCompressionRatio=300

# 검증(순차 스트리밍) 자체의 최대 소요 시간(초)
ada.validate.maxValidationSeconds=1800

# 보관 기간(일)
ada.retention.days=30

# 정리 배치 실행 주기(분)
ada.retention.cleanupIntervalMinutes=60

# ---- 분석 JOB/ATTEMPT (Worker 연동) ----

# heartbeat가 이 시간(초) 이상 갱신되지 않으면 RECOVERY_REQUIRED로 전환한다(FAILED/CANCELLED로 단정하지 않음).
# 배치 실행 주기는 이 값의 절반(최소 30초)이다.
ada.analysis.heartbeatTimeoutSeconds=180

# Worker가 분석 결과(보고서 md + images/ + evidence/ + result.zip)를 쓰는 공유 경로.
# ADA는 이 경로에서 읽기만 한다. Worker(adawork)에게는 ACL로 쓰기 권한이, ADA(jboss)에게는 소유자 권한이 있다.
ada.storage.resultRoot=/DATA/ada/results

# 내부 Worker API(/worker/**) 인증 토큰. 비워두면 /worker/** 전체를 503으로 거절한다(fail closed).
# 실제 값은 이 파일(소스에 커밋되는 파일)에 넣지 말고, 운영 JBoss standalone.xml의 system-properties 또는
# JNDI가 아닌 별도 -D 시스템 프로퍼티/환경변수로 이 키를 오버라이드해서 주입해야 한다.
ada.worker.apiToken=

# 내부 Worker API를 호출할 수 있는 발신 IP 허용 목록(콤마 구분). 비워두면 토큰만으로 인증한다(IP 제한 없음).
# 운영에서는 Worker(192.168.2.17)만 허용하도록 설정을 권장한다.
ada.worker.allowedIps=192.168.2.17
